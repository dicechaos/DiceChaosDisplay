name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Run Test Suite
        run: dotnet test Tests/DiceChaosDisplay.Tests.csproj --configuration Release --verbosity normal

      - name: Publish Self-Contained Windows x64 Package (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $folderName = "DiceChaosDisplay-$tag-win-x64"
          dotnet publish DiceChaosDisplay.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:DebugSymbols=false -o "publish/$folderName"
          New-Item -ItemType Directory -Force -Path "Releases" | Out-Null
          $zipPath = "Releases/$folderName.zip"
          Compress-Archive -Path "publish/$folderName/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $folderName.zip" | Set-Content -Path "Releases/SHA256SUMS.txt" -Encoding UTF8

      - name: Create GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dice Chaos Display ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            Releases/*.zip
            Releases/SHA256SUMS.txt
